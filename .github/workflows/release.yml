name: Release

# Tagging is the only trigger. The tagged commit has already been through CI on
# `main`, so this workflow publishes the release rather than re-running the
# gates — a second run of the same four steps on the same tree proves nothing.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Generated notes are built from the commits back to the previous
          # tag, which a shallow clone does not have.
          fetch-depth: 0

      # A tag on a commit that never reached `main` would publish a release for
      # code no CI run ever saw.
      - name: Refuse a tag that is not on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME does not point at a commit on main"
            exit 1
          }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
